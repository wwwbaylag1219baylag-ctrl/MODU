<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11110f"><title>Жагсаалт — НИЙТ.мн</title>
<style>
:root{--bg:#11110f;--panel:#1b1b18;--panel2:#24231e;--gold:#f3c64e;--text:#f8f6ef;--muted:#a6a397;--line:#37362f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}button,input,select{font:inherit}.wrap{width:min(1160px,calc(100% - 32px));margin:auto}header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center}.nav{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:950;font-size:25px;letter-spacing:-1px}.logo span{color:var(--gold)}.back{color:var(--gold);font-size:13px;font-weight:800}main{padding:32px 0 70px}.crumb{font-size:12px;color:var(--muted);margin-bottom:15px}.crumb a{color:var(--gold)}h1{font-size:clamp(30px,5vw,44px);letter-spacing:-1.5px;margin:0 0 8px}.sub{color:var(--muted);font-size:14px;margin:0 0 25px}.toolbar{display:grid;grid-template-columns:1fr 210px 160px;gap:10px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:15px;margin-bottom:22px}.toolbar input,.toolbar select{width:100%;background:#11110f;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:12px;outline:none}.toolbar input:focus,.toolbar select:focus{border-color:var(--gold)}.count{color:var(--muted);font-size:12px;margin-bottom:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#9b7b31}.visual{height:155px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#51401e,#242219 72%);font-size:58px;position:relative}.visual img{width:100%;height:100%;object-fit:cover}.visual small{position:absolute;top:12px;left:12px;background:#171611dd;color:var(--gold);border:1px solid #665329;border-radius:30px;padding:6px 9px;font-size:10px;font-weight:800}.body{padding:15px}.body h2{font-size:16px;margin:0 0 8px}.price{font-size:19px;color:var(--gold);font-weight:900}.meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}.empty{display:none;padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.demo{font-size:11px;color:#a59c83;margin-top:25px;line-height:1.6}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:9px}.visual{height:115px;font-size:42px}.body{padding:11px}.body h2{font-size:13px}.price{font-size:15px}.meta{font-size:9px;display:block}.toolbar{gap:7px;padding:9px}.toolbar input,.toolbar select{font-size:12px;padding:10px}}@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="wrap nav"><a class="logo" href="index.html">НИЙТ<span>.мн</span></a><a class="back" href="categories.html">← Ангилал</a></div></header>
<main class="wrap"><div class="crumb"><a href="index.html">НИЙТ.мн</a> / <a href="categories.html">Ангилал</a> / Жагсаалт</div><h1 id="heading">Хэрэгтэй зүйлс</h1><p class="sub">Бараа, үйлчилгээ, боломжуудыг нэг дороос хайж олоорой.</p>
<div class="toolbar"><input id="q" placeholder="Нэр, тайлбараар хайх..."><select id="category"><option value="all">Бүх ангилал</option><option value="shopping">Худалдаа</option><option value="property">Үл хөдлөх</option><option value="auto">Авто</option><option value="services">Үйлчилгээ</option><option value="food">Хоол, хүнс</option><option value="jobs">Ажил, бизнес</option><option value="education">Боловсрол</option><option value="health">Эрүүл мэнд</option><option value="travel">Аялал</option><option value="events">Үзвэр, эвент</option><option value="pets">Амьтан</option><option value="other">Бусад</option></select><select id="sort"><option value="new">Шинэ эхэнд</option><option value="low">Үнэ: багаас</option><option value="high">Үнэ: ихээс</option></select></div>
<div class="count" id="count"></div><div class="grid" id="grid"></div><div class="empty" id="empty">Тохирох зар, бараа олдсонгүй.</div><p class="demo">Баталгаажсан бодит зар нийтэд харагдана. Хэрэв бодит зар хараахан бүртгэгдээгүй бол доорх мэдээлэл зөвхөн жишээ өгөгдөл.</p></main>
<script>
let items=[
{id:'p1',cat:'shopping',name:'Ухаалаг утас — жишээ зар',price:850000,emoji:'📱',place:'Улаанбаатар',date:'2026-11-25',desc:'Өдөр тутмын хэрэглээнд тохиромжтой ухаалаг утасны үзүүлэн зар. Бодит зар биш.'},
{id:'p2',cat:'property',name:'2 өрөө байр — жишээ зар',price:185000000,emoji:'🏙️',place:'Хан-Уул дүүрэг',date:'2026-11-24',desc:'Орон сууцны ангиллын дэлгэрэнгүй хуудасны жишээ мэдээлэл.'},

{id:'p5',cat:'food',name:'Өдрийн хоол — жишээ санал',price:18000,emoji:'🍜',place:'Сүхбаатар дүүрэг',date:'2026-11-25',desc:'Хоол, рестораны саналын туршилтын мэдээлэл.'},
{id:'p6',cat:'jobs',name:'Цагийн ажил — жишээ зар',price:8000,emoji:'💼',place:'Улаанбаатар',date:'2026-11-22',desc:'Ажил, боломжийн ангиллын жишээ мэдээлэл.'},
{id:'p7',cat:'education',name:'Англи хэлний сургалт',price:120000,emoji:'📚',place:'Онлайн',date:'2026-11-21',desc:'Боловсролын үйлчилгээний үзүүлэн мэдээлэл.'},
{id:'p8',cat:'health',name:'Шүдний эмнэлэг — жишээ',price:0,emoji:'✚',place:'Улаанбаатар',date:'2026-11-20',desc:'Эрүүл мэндийн байгууллагын танилцуулгын жишээ.'},

{id:'p10',cat:'events',name:'Амьд хөгжмийн үдэш — жишээ эвент',price:35000,emoji:'🎸',place:'Улаанбаатар',date:'2026-11-28',desc:'Амьд хөгжмийн тоглолтын үзүүлэн мэдээлэл. Огноо, тасалбарын үнэ нь бодит эвент биш.'},
{id:'p11',cat:'events',name:'Кино үдэш — жишээ арга хэмжээ',price:18000,emoji:'🎬',place:'Улаанбаатар',date:'2026-11-29',desc:'Кино үзвэрийн ангиллын жишээ мэдээлэл. Бодит тасалбар худалдахгүй.'},
{id:'p12',cat:'events',name:'Спортын өдөр — жишээ тэмцээн',price:10000,emoji:'🏅',place:'Дархан',date:'2026-12-05',desc:'Спортын арга хэмжээний үзүүлэн мэдээлэл. Бодит бүртгэл нээлтгүй.'},
{id:'p13',cat:'pets',name:'Амьтны асаргаа — жишээ үйлчилгээ',price:25000,emoji:'🐾',place:'Улаанбаатар',date:'2026-11-25',desc:'Амьтан асаргааны үйлчилгээний үзүүлэн мэдээлэл.'},
{id:'p14',cat:'other',name:'Сайн дурын өдөр — жишээ зар',price:0,emoji:'🤝',place:'Улаанбаатар',date:'2026-11-26',desc:'Олон нийтийн оролцооны үзүүлэн зар.'}
];
const names={shopping:'Худалдаа',property:'Үл хөдлөх',auto:'Авто',services:'Үйлчилгээ',food:'Хоол, хүнс',jobs:'Ажил, бизнес',education:'Боловсрол',health:'Эрүүл мэнд',travel:'Аялал',events:'Үзвэр, эвент',pets:'Амьтан',other:'Бусад'};
const q=document.getElementById('q'),cat=document.getElementById('category'),sort=document.getElementById('sort'),grid=document.getElementById('grid');
const params=new URLSearchParams(location.search);if(names[params.get('category')])cat.value=params.get('category');if(params.get('sub'))q.value=params.get('sub');if(params.get('q'))q.value=params.get('q');
function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}function money(n){return n?new Intl.NumberFormat('mn-MN').format(n)+' ₮':'Үнэ тохирно'}
let liveData=false;function render(){let a=items.filter(x=>(cat.value==='all'||x.cat===cat.value)&&(!q.value||((x.name+' '+x.desc+' '+names[x.cat]+' '+(x.subcategory||'')).toLocaleLowerCase('mn').includes(q.value.toLocaleLowerCase('mn')))));if(sort.value==='low')a.sort((x,y)=>x.price-y.price);else if(sort.value==='high')a.sort((x,y)=>y.price-x.price);else a.sort((x,y)=>y.date.localeCompare(x.date));document.getElementById('heading').textContent=cat.value==='all'?'Хэрэгтэй зүйлс':names[cat.value];document.getElementById('count').textContent=a.length+(liveData?' зар':' жишээ мэдээлэл');grid.innerHTML=a.map(x=>'<a class="card" href="listing.html?id='+encodeURIComponent(x.id)+'"><div class="visual"><small>'+names[x.cat]+'</small>'+(x.image&&/^https:\/\//i.test(x.image)?'<img src="'+esc(x.image)+'" alt="" loading="lazy">':x.emoji)+'</div><div class="body"><h2>'+esc(x.name)+'</h2><div class="price">'+(x.negotiable?'Үнэ тохирно':money(x.price))+'</div><div class="meta"><span>⌖ '+x.place+'</span><span>'+x.date+'</span></div></div></a>').join('');document.getElementById('empty').style.display=a.length?'none':'block'}q.addEventListener('input',render);cat.addEventListener('change',render);sort.addEventListener('change',render);render();

import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://oyxvjatfuqzukdrdlvfb.supabase.co','sb_publishable_s--2ZhRuOvl07HZIr2stqQ_dgDNosK6');
const icons={shopping:'🛍️',property:'🏙️',auto:'🚘',services:'🛠️',food:'🍜',jobs:'💼',education:'📚',health:'✚',travel:'✈️',events:'🎭',pets:'🐾',other:'✦'};
const {data:live,error:liveError}=await sb.from('listings').select('id,title,description,category,subcategory,price,price_negotiable,location,created_at,images').eq('status','approved').order('created_at',{ascending:false});
if(!liveError&&live&&live.length){items=live.map(x=>({id:x.id,cat:x.category,name:x.title,price:x.price||0,emoji:icons[x.category]||'✦',place:x.location,date:x.created_at.slice(0,10),desc:x.description,subcategory:x.subcategory,image:x.images?.[0]||null,negotiable:x.price_negotiable}));liveData=true;render()}
</script></body></html>
