<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10110f"><title>Хямдрал нийтлэх — НИЙТ.мн</title><style>
:root{color-scheme:dark;--bg:#10110f;--panel:#191a17;--line:#34352e;--gold:#efc34e;--text:#f7f5ed;--muted:#aaa99f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:22px}.wrap{max-width:700px;margin:auto}.brand{display:block;text-align:center;font-size:27px;font-weight:950;text-decoration:none;color:var(--text);margin:10px 0 24px}.brand span{color:var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:25px}.eyebrow{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:1.5px}h1{font-size:26px;margin:8px 0}.sub{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 20px}label{display:block;font-size:12px;font-weight:800;margin:14px 0 7px}input,select,textarea{width:100%;border:1px solid var(--line);background:#10110f;border-radius:10px;padding:13px;color:var(--text);font:inherit;font-size:13px}textarea{min-height:120px}.btn{width:100%;padding:14px;background:var(--gold);color:#17150e;border:0;border-radius:10px;font-weight:950;margin-top:20px}.msg{display:none;margin-top:14px;padding:12px;border-radius:9px;background:#27251d;color:#f2d98c;font-size:12px;line-height:1.6}.back{display:block;text-align:center;color:var(--muted);font-size:12px;margin:18px;text-decoration:none}
</style></head><body><main class="wrap"><a class="brand" href="index.html">НИЙТ<span>.мн</span></a><section class="panel"><div class="eyebrow">НИЙТ · ХЯМДРАЛ, КУПОН</div><h1>Онцгой саналаа нийтлээрэй.</h1><p class="sub">Өөрийн баталгаажсан бизнесээ сонгож, хүчинтэй хугацаатай хямдралын мэдээлэл оруулна. Санал админы хяналтад орно.</p><form id="form"><label for="business">Бизнес *</label><select id="business" required><option value="">Бизнес сонгох</option></select><label for="title">Саналын гарчиг *</label><input id="title" required minlength="4" maxlength="140" placeholder="Жишээ: Өдрийн хоол 20% хямдарлаа"><label for="discount">Хямдралын тэмдэглэгээ *</label><input id="discount" required maxlength="60" placeholder="Жишээ: 20% хямдрал"><label for="description">Дэлгэрэнгүй нөхцөл *</label><textarea id="description" required minlength="10" maxlength="5000" placeholder="Хямдралын нөхцөл, хамрах бүтээгдэхүүн, үйлчилгээ..."></textarea><label for="starts">Эхлэх хугацаа *</label><input id="starts" type="datetime-local" required><label for="ends">Дуусах хугацаа *</label><input id="ends" type="datetime-local" required><button class="btn" id="send">Хяналтад илгээх →</button></form><div class="msg" id="msg" role="status" aria-live="polite"></div></section><a class="back" href="account.html">← Миний бүртгэл</a></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://oyxvjatfuqzukdrdlvfb.supabase.co','sb_publishable_s--2ZhRuOvl07HZIr2stqQ_dgDNosK6'),$=id=>document.getElementById(id),msg=t=>{$('msg').textContent=t;$('msg').style.display='block'};
const {data:{session}}=await sb.auth.getSession();if(!session)location.href='auth.html?next=deal-form.html';
const {data:businesses,error}=await sb.from('businesses').select('id,name').eq('owner_id',session.user.id).eq('status','approved');for(const b of businesses||[]){const o=document.createElement('option');o.value=b.id;o.textContent=b.name;$('business').append(o)}if(error)msg(error.message);if(!businesses?.length)msg('Хямдрал нийтлэхийн өмнө таны бизнес админаар баталгаажсан байх шаардлагатай.');
$('form').onsubmit=async e=>{e.preventDefault();const start=new Date($('starts').value),end=new Date($('ends').value);if(end<=start||start<new Date()){msg('Эхлэх болон дуусах хугацааг зөв сонгоно уу.');return}$('send').disabled=true;const {error}=await sb.from('deals').insert({business_id:$('business').value,owner_id:session.user.id,title:$('title').value.trim(),description:$('description').value.trim(),discount_label:$('discount').value.trim(),starts_at:start.toISOString(),ends_at:end.toISOString(),status:'pending'});if(error)msg(error.message);else{msg('Хямдралын хүсэлт админы хяналтад илгээгдлээ.');$('form').reset()}$('send').disabled=false};
</script></body></html>
