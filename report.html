<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10110f"><title>Мэдээлэх — НИЙТ.мн</title><style>
:root{color-scheme:dark;--bg:#10110f;--panel:#191a17;--line:#34352e;--gold:#efc34e;--text:#f7f5ed;--muted:#aaa99f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:20px}.wrap{max-width:650px;margin:auto}.brand{display:block;text-align:center;font-size:27px;font-weight:950;text-decoration:none;color:var(--text);margin:10px 0 24px}.brand span{color:var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}.eyebrow{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:1.5px}h1{font-size:25px;margin:8px 0}.muted{color:var(--muted);font-size:12px;line-height:1.7}label{display:block;font-size:12px;font-weight:800;margin:15px 0 7px}select,textarea{width:100%;background:#10110f;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:13px;font:inherit;font-size:13px}textarea{min-height:120px;resize:vertical}.btn{width:100%;padding:14px;background:var(--gold);color:#17150e;border:0;border-radius:10px;font-weight:950;margin-top:18px}.msg{display:none;padding:12px;border-radius:9px;background:#27251d;color:#f2d98c;font-size:12px;line-height:1.6;margin-top:14px}.back{display:block;text-align:center;color:var(--muted);font-size:12px;margin:18px;text-decoration:none}
</style></head><body><main class="wrap"><a class="brand" href="index.html">НИЙТ<span>.мн</span></a><section class="panel"><div class="eyebrow">НИЙТ · АЮУЛГҮЙ БАЙДАЛ</div><h1>Мэдээлэл илгээх</h1><p class="muted" id="target">Мэдээлж буй контентыг ачаалж байна…</p><form id="form"><label for="reason">Шалтгаан *</label><select id="reason" required><option value="">Сонгох</option><option value="fraud">Залилан, луйвар</option><option value="prohibited">Хориглосон бараа, үйлчилгээ</option><option value="misleading">Худал, төөрөгдүүлсэн мэдээлэл</option><option value="spam">Спам, давхардсан мэдээлэл</option><option value="copyright">Зохиогчийн эрхийн зөрчил</option><option value="other">Бусад</option></select><label for="details">Нэмэлт тайлбар</label><textarea id="details" maxlength="3000" placeholder="Ямар зөрчил байгааг тайлбарлана уу."></textarea><button class="btn" id="send">Мэдээлэл илгээх →</button></form><div class="msg" id="msg" role="status" aria-live="polite"></div></section><a class="back" href="index.html">← Нүүр хуудас</a></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://oyxvjatfuqzukdrdlvfb.supabase.co','sb_publishable_s--2ZhRuOvl07HZIr2stqQ_dgDNosK6'),$=id=>document.getElementById(id),params=new URLSearchParams(location.search),type=params.get('type'),id=params.get('id');
const {data:{session}}=await sb.auth.getSession();if(!session){location.href='auth.html?next=report.html'+encodeURIComponent(location.search)}
let targetRow=null;if(type==='listing'&&id){const {data}=await sb.from('listings').select('id,title').eq('id',id).eq('status','approved').maybeSingle();targetRow=data}else if(type==='business'&&id){const {data}=await sb.from('businesses').select('id,name').eq('id',id).eq('status','approved').maybeSingle();targetRow=data}
$('target').textContent=targetRow?'Мэдээлэх зүйл: '+(targetRow.title||targetRow.name):'Мэдээлэх контент олдсонгүй эсвэл нийтэд харагдахгүй байна.';
$('form').onsubmit=async e=>{e.preventDefault();if(!session||!targetRow)return;$('send').disabled=true;const row={reporter_id:session.user.id,listing_id:type==='listing'?id:null,business_id:type==='business'?id:null,reason:$('reason').value,details:$('details').value.trim()||null,status:'pending'};const {error}=await sb.from('reports').insert(row);$('msg').style.display='block';$('msg').textContent=error?error.message:'Мэдээлэл амжилттай илгээгдлээ. Админ шалгана.';if(!error)$('form').reset();$('send').disabled=false};
</script></body></html>
