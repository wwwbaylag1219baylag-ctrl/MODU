<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10110f"><title>Бизнес — НИЙТ.мн</title><style>
:root{color-scheme:dark;--bg:#10110f;--panel:#191a17;--line:#34352e;--gold:#efc34e;--text:#f7f5ed;--muted:#aaa99f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:20px}.wrap{max-width:800px;margin:auto}.brand{display:block;text-align:center;color:var(--text);font-size:27px;font-weight:950;text-decoration:none;margin:8px 0 24px}.brand span{color:var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:25px}.hero{display:flex;gap:18px;align-items:center}.logo{width:92px;height:92px;border-radius:18px;background:#342c1a;display:grid;place-items:center;font-size:38px;overflow:hidden;flex:none}.logo img{width:100%;height:100%;object-fit:cover}.eyebrow{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:1.4px}.title{font-size:28px;margin:6px 0}.muted{color:var(--muted);font-size:12px;line-height:1.7}.desc{white-space:pre-wrap;line-height:1.8;font-size:14px;margin:24px 0}.links{display:flex;gap:10px;flex-wrap:wrap}.link{display:inline-block;padding:12px 15px;border-radius:9px;background:var(--gold);color:#17150e;text-decoration:none;font-size:12px;font-weight:900}.link.alt{border:1px solid var(--line);background:transparent;color:var(--text)}.back{display:block;color:var(--muted);font-size:12px;margin:20px 0;text-decoration:none}.empty{text-align:center;color:var(--muted);padding:40px}
</style></head><body><main class="wrap"><a class="brand" href="index.html">НИЙТ<span>.мн</span></a><section class="panel" id="content"><div class="empty">Бизнесийн мэдээлэл ачаалж байна…</div></section><a class="back" href="businesses.html">← Бизнесийн лавлах</a></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://oyxvjatfuqzukdrdlvfb.supabase.co','sb_publishable_s--2ZhRuOvl07HZIr2stqQ_dgDNosK6');
const root=document.getElementById('content'),id=new URLSearchParams(location.search).get('id');
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
if(!id){root.replaceChildren(el('div','empty','Бизнесийн мэдээлэл олдсонгүй.'))}else{const {data:x,error}=await sb.from('businesses').select('name,category,description,location,phone,email,website,logo_url,verified').eq('id',id).eq('status','approved').maybeSingle();if(error||!x){root.replaceChildren(el('div','empty','Энэ бизнес олдсонгүй эсвэл баталгаажаагүй байна.'));}else{document.title=x.name+' — НИЙТ.мн';const hero=el('div','hero'),logo=el('div','logo');if(x.logo_url){const im=el('img');im.src=x.logo_url;im.alt=x.name;logo.append(im)}else logo.textContent='🏢';const info=el('div'),ey=el('div','eyebrow',x.verified?'БАТАЛГААЖСАН БИЗНЕС':'НИЙТ.мн БИЗНЕС'),title=el('h1','title',x.name),meta=el('div','muted',(x.category||'Бизнес')+' · '+x.location);info.append(ey,title,meta);hero.append(logo,info);const desc=el('p','desc',x.description),links=el('div','links');if(x.phone){const a=el('a','link','Утасдах');a.href='tel:'+x.phone;links.append(a)}if(x.email){const a=el('a','link alt','И-мэйл');a.href='mailto:'+x.email;links.append(a)}if(x.website){const a=el('a','link alt','Вэбсайт');a.href=/^https?:\/\//i.test(x.website)?x.website:'https://'+x.website;a.target='_blank';a.rel='noopener noreferrer';links.append(a)}const report=el('a','link alt','Мэдээлэх');report.href='report.html?type=business&id='+encodeURIComponent(id);links.append(report);root.replaceChildren(hero,desc,links)}}
</script></body></html>
