<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10110f"><title>Нэвтрэх, бүртгүүлэх — НИЙТ.мн</title><style>
:root{color-scheme:dark;--bg:#10110f;--panel:#191a17;--line:#34352e;--gold:#efc34e;--muted:#aaa99f;--white:#f7f5ed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#282316 0,transparent 45%),var(--bg);color:var(--white);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding:24px;display:grid;place-items:center}.wrap{width:100%;max-width:440px}.brand{display:block;text-align:center;color:var(--white);font-weight:950;font-size:28px;letter-spacing:-1.3px;text-decoration:none;margin:0 0 24px}.brand span{color:var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 24px 70px #0007}.eyebrow{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase}h1{font-size:25px;margin:8px 0}.sub{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 22px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#10110f;padding:4px;border-radius:11px;margin-bottom:20px}.tabs button{border:0;background:transparent;color:var(--muted);padding:11px;border-radius:8px;font-weight:800;cursor:pointer}.tabs button.active{background:var(--gold);color:#17150e}label{display:block;font-size:12px;font-weight:750;margin:14px 0 7px}input{width:100%;background:#10110f;border:1px solid var(--line);border-radius:10px;padding:14px;color:var(--white);font:inherit;outline:none}input:focus{border-color:var(--gold)}.primary{width:100%;border:0;border-radius:10px;padding:14px;background:var(--gold);color:#17150e;font-weight:950;margin-top:19px;cursor:pointer}.secondary{display:block;text-align:center;margin:14px auto 0;background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer}.consent{display:flex;align-items:flex-start;gap:8px;font-size:11px;color:var(--muted);line-height:1.6;margin-top:15px}.consent input{width:auto;margin-top:3px}.consent a{color:var(--gold)}.message{display:none;padding:12px;border-radius:9px;background:#25271f;color:#e9d99f;font-size:12px;line-height:1.6;margin-top:14px}.back{display:block;text-align:center;color:var(--muted);font-size:12px;text-decoration:none;margin-top:18px}.status{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 0;min-height:18px}@media(max-width:420px){body{padding:16px}.panel{padding:21px}}
</style></head><body><main class="wrap"><a class="brand" href="index.html">НИЙТ<span>.мн</span></a><section class="panel"><div class="eyebrow">Өдөр бүр хэрэгтэй бүх зүйл</div><h1 id="title">Тавтай морил</h1><p class="sub" id="subtitle">Нэвтэрч, НИЙТ.мн-ийн үйлчилгээг ашиглаарай.</p><div class="tabs" id="tabs"><button id="loginTab" class="active" type="button">Нэвтрэх</button><button id="signupTab" type="button">Бүртгүүлэх</button></div><form id="authForm"><div id="nameWrap" hidden><label for="fullName">Таны нэр</label><input id="fullName" autocomplete="name" maxlength="80" placeholder="Овог, нэр"></div><div id="emailWrap"><label for="email">И-мэйл хаяг</label><input id="email" type="email" autocomplete="email" required maxlength="254" placeholder="name@example.com"></div><label for="password">Нууц үг</label><input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128" placeholder="8-аас дээш тэмдэгт"><div id="consentWrap" hidden class="consent"><input id="consent" type="checkbox" required><span>Би <a href="terms.html" target="_blank" rel="noopener noreferrer">Үйлчилгээний нөхцөл</a> болон <a href="privacy.html" target="_blank" rel="noopener noreferrer">Нууцлалын бодлого</a>-той танилцаж зөвшөөрч байна.</span></div><button class="primary" id="submit" type="submit">Нэвтрэх</button></form><button class="secondary" id="forgot" type="button">Нууц үг мартсан уу?</button><div class="message" id="message" role="status" aria-live="polite"></div><p class="status" id="status"></p></section><a class="back" href="index.html">← Нүүр хуудас руу буцах</a></main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://oyxvjatfuqzukdrdlvfb.supabase.co','sb_publishable_s--2ZhRuOvl07HZIr2stqQ_dgDNosK6');
const $=id=>document.getElementById(id);let mode=location.hash.includes('type=recovery')?'reset':new URLSearchParams(location.search).get('mode')==='signup'?'signup':'login';
const nextPage=new URLSearchParams(location.search).get('next');const destination=nextPage&&/^[a-z0-9-]+\.html$/i.test(nextPage)?nextPage:'index.html';
function note(t){$('message').textContent=t;$('message').style.display='block'}
function render(){const signup=mode==='signup',reset=mode==='reset';$('tabs').hidden=reset;$('loginTab').classList.toggle('active',!signup&&!reset);$('signupTab').classList.toggle('active',signup);$('title').textContent=reset?'Нууц үг шинэчлэх':signup?'Шинэ бүртгэл үүсгэх':'Тавтай морил';$('subtitle').textContent=reset?'Шинэ нууц үгээ оруулна уу.':signup?'И-мэйл хаяг, нууц үгээрээ бүртгэлээ үүсгээрэй.':'Нэвтэрч, НИЙТ.мн-ийн үйлчилгээг ашиглаарай.';$('nameWrap').hidden=!signup;$('fullName').required=signup;$('consentWrap').hidden=!signup;$('consent').required=signup;$('emailWrap').hidden=reset;$('email').required=!reset;$('password').autocomplete=reset?'new-password':'current-password';$('password').value='';$('submit').textContent=reset?'Нууц үг шинэчлэх':signup?'Бүртгэл үүсгэх':'Нэвтрэх';$('forgot').hidden=signup||reset;$('message').style.display='none'}$('loginTab').onclick=()=>{mode='login';render()};$('signupTab').onclick=()=>{mode='signup';render()};
$('authForm').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;$('status').textContent='Түр хүлээнэ үү…';try{const email=$('email').value.trim(),password=$('password').value;let result;if(mode==='reset'){result=await supabase.auth.updateUser({password});if(result.error)throw result.error;note('Нууц үг амжилттай шинэчлэгдлээ. Нүүр хуудас руу шилжүүлж байна.');setTimeout(()=>location.href='index.html',1200);return}else if(mode==='signup'){result=await supabase.auth.signUp({email,password,options:{data:{full_name:$('fullName').value.trim()},emailRedirectTo:location.origin+location.pathname.replace(/[^/]*$/,'')+destination}});if(result.error)throw result.error;if(result.data.session){location.href=destination;return}note('Бүртгэл үүсгэх хүсэлт амжилттай. И-мэйл хаяг руу илгээсэн баталгаажуулах холбоосыг нээгээрэй.');}else{result=await supabase.auth.signInWithPassword({email,password});if(result.error)throw result.error;location.href=destination;return}}catch(err){note(err.message||'Алдаа гарлаа. Дахин оролдоно уу.')}finally{$('submit').disabled=false;$('status').textContent=''}});
$('forgot').onclick=async()=>{const email=$('email').value.trim();if(!email){note('Нууц үг сэргээх холбоос авахын тулд эхлээд и-мэйлээ оруулна уу.');return}const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname.replace(/[^/]*$/,'')+'auth.html'});note(error?error.message:'Нууц үг сэргээх холбоосыг и-мэйл рүү илгээлээ.')};
const {data:{session}}=await supabase.auth.getSession();if(session){$('status').textContent='Та аль хэдийн нэвтэрсэн байна.'}
render();
</script></body></html>
