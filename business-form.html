<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10110f"><title>Бизнес бүртгүүлэх — НИЙТ.мн</title><style>
:root{color-scheme:dark;--bg:#10110f;--panel:#191a17;--line:#34352e;--gold:#efc34e;--text:#f7f5ed;--muted:#aaa99f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:22px}.wrap{max-width:760px;margin:auto}.brand{display:block;text-align:center;font-size:27px;font-weight:950;text-decoration:none;color:var(--text);margin:10px 0 24px}.brand span{color:var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px}.eyebrow{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:1.5px}h1{font-size:27px;margin:8px 0}.sub{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:800;margin:14px 0 7px}input,select,textarea{width:100%;border:1px solid var(--line);background:#10110f;border-radius:10px;padding:13px;color:var(--text);font:inherit;font-size:13px}textarea{min-height:125px;resize:vertical}input:focus,select:focus,textarea:focus{outline:1px solid var(--gold);border-color:var(--gold)}.hint{font-size:10px;color:var(--muted);line-height:1.6;margin-top:6px}.primary{width:100%;padding:14px;background:var(--gold);color:#17150e;border:0;border-radius:10px;font-weight:950;margin-top:20px;cursor:pointer}.primary:disabled{opacity:.55}.msg{display:none;margin-top:14px;padding:12px;border-radius:9px;background:#27251d;color:#f2d98c;font-size:12px;line-height:1.6}.back{display:block;text-align:center;color:var(--muted);font-size:12px;margin:18px;text-decoration:none}@media(max-width:560px){body{padding:12px}.panel{padding:18px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><main class="wrap"><a class="brand" href="index.html">НИЙТ<span>.мн</span></a><section class="panel"><div class="eyebrow">НИЙТ · БИЗНЕСИЙН БҮРТГЭЛ</div><h1>Бизнесээ танилцуулаарай.</h1><p class="sub">Бизнесийн мэдээллээ илгээнэ үү. Админ хянаж баталгаажуулсны дараа бизнесийн лавлахад нийтлэгдэнэ.</p><form id="form"><div class="grid">
<div class="full"><label for="name">Бизнесийн нэр *</label><input id="name" required minlength="2" maxlength="120" placeholder="Байгууллага, дэлгүүрийн нэр"></div>
<div><label for="category">Үйл ажиллагааны төрөл *</label><select id="category" required><option value="">Сонгох</option><option value="shop">Дэлгүүр</option><option value="food">Хоол, ресторан</option><option value="service">Үйлчилгээ</option><option value="company">Компани</option></select></div>
<div><label for="location">Байршил *</label><select id="location" required><option value="">Сонгох</option><option>Улаанбаатар</option><option>Дархан</option><option>Эрдэнэт</option><option>Орон нутаг</option></select></div>
<div class="full"><label for="description">Бизнесийн танилцуулга *</label><textarea id="description" required minlength="10" maxlength="10000" placeholder="Үйл ажиллагаа, бүтээгдэхүүн, үйлчилгээнийхээ талаар бичнэ үү."></textarea></div>
<div><label for="phone">Утас</label><input id="phone" type="tel" maxlength="30" placeholder="Холбоо барих дугаар"></div>
<div><label for="email">И-мэйл</label><input id="email" type="email" maxlength="254" placeholder="business@example.com"></div>
<div class="full"><label for="website">Вэбсайт эсвэл сошиал холбоос</label><input id="website" type="url" maxlength="500" placeholder="https://"></div>
<div class="full"><label for="logo">Лого (JPG, PNG, WEBP; 5 MB хүртэл)</label><input id="logo" type="file" accept="image/jpeg,image/png,image/webp"><p class="hint">Лого нь бизнесийн профайлд харагдана.</p></div>
</div><button class="primary" id="send" type="submit">Баталгаажуулалтад илгээх →</button></form><div class="msg" id="msg" role="status" aria-live="polite"></div></section><a class="back" href="businesses.html">← Бизнесийн лавлах</a></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://oyxvjatfuqzukdrdlvfb.supabase.co','sb_publishable_s--2ZhRuOvl07HZIr2stqQ_dgDNosK6');
const $=id=>document.getElementById(id),msg=t=>{$('msg').textContent=t;$('msg').style.display='block'};
const {data:{session}}=await sb.auth.getSession();if(!session)location.href='auth.html?mode=signup&next=business-form.html';
const editId=new URLSearchParams(location.search).get('id');let existingLogo=null;
if(session&&editId){const {data:x,error}=await sb.from('businesses').select('*').eq('id',editId).eq('owner_id',session.user.id).maybeSingle();if(error||!x){msg('Бизнес олдсонгүй эсвэл засах эрхгүй байна.')}else{$('name').value=x.name;$('category').value=x.category;$('location').value=x.location;$('description').value=x.description;$('phone').value=x.phone||'';$('email').value=x.email||'';$('website').value=x.website||'';existingLogo=x.logo_url;document.querySelector('h1').textContent='Бизнесийн мэдээллээ засах.';$('send').textContent='Шинэчлээд хяналтад илгээх →';if(existingLogo)msg('Одоогийн лого хадгалагдсан. Шинэ лого сонговол солино.')}}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(!session)return;const f=$('logo').files[0];if(f&&(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5242880)){msg('Лого JPG, PNG эсвэл WEBP бөгөөд 5 MB-аас бага байх ёстой.');return}
$('send').disabled=true;$('send').textContent='Илгээж байна…';let logoUrl=existingLogo,uploadedPath=null;
try{if(f){uploadedPath=session.user.id+'/'+crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error}=await sb.storage.from('niit-uploads').upload(uploadedPath,f,{cacheControl:'3600',upsert:false});if(error)throw error;logoUrl=sb.storage.from('niit-uploads').getPublicUrl(uploadedPath).data.publicUrl}
const row={owner_id:session.user.id,name:$('name').value.trim(),category:$('category').value,description:$('description').value.trim(),location:$('location').value,phone:$('phone').value.trim()||null,email:$('email').value.trim()||null,website:$('website').value.trim()||null,logo_url:logoUrl,status:'pending',verified:false};
let error;if(editId){({error}=await sb.from('businesses').update(row).eq('id',editId).eq('owner_id',session.user.id))}else{row.slug='biz-'+crypto.randomUUID().slice(0,12);({error}=await sb.from('businesses').insert(row))}
if(error)throw error;msg(editId?'Бизнесийн өөрчлөлт хяналтад илгээгдлээ.':'Бизнесийн хүсэлт амжилттай илгээгдлээ. Админ баталгаажуулсны дараа лавлахад харагдана.');$('form').reset();setTimeout(()=>location.href='account.html',1600);
}catch(err){if(uploadedPath)await sb.storage.from('niit-uploads').remove([uploadedPath]);msg(err.message||'Илгээхэд алдаа гарлаа.')}finally{$('send').disabled=false;$('send').textContent=editId?'Шинэчлээд хяналтад илгээх →':'Баталгаажуулалтад илгээх →'}});
</script></body></html>
