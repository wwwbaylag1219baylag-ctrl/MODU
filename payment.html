<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10110f"><title>Төлбөрийн баримт илгээх — НИЙТ.мн</title><style>
:root{color-scheme:dark;--bg:#10110f;--panel:#191a17;--line:#34352e;--gold:#efc34e;--text:#f7f5ed;--muted:#aaa99f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:22px}.wrap{max-width:700px;margin:auto}.brand{display:block;text-align:center;font-size:27px;font-weight:950;text-decoration:none;color:var(--text);margin:10px 0 24px}.brand span{color:var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:25px}.eyebrow{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:1.5px}h1{font-size:26px;margin:8px 0}.sub{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 20px}label{display:block;font-size:12px;font-weight:800;margin:14px 0 7px}input,select{width:100%;border:1px solid var(--line);background:#10110f;border-radius:10px;padding:13px;color:var(--text);font:inherit;font-size:13px}.btn{width:100%;padding:14px;background:var(--gold);color:#17150e;border:0;border-radius:10px;font-weight:950;margin-top:20px}.msg{display:none;margin-top:14px;padding:12px;border-radius:9px;background:#27251d;color:#f2d98c;font-size:12px;line-height:1.6}.hint{font-size:10px;color:var(--muted);line-height:1.6}.back{display:block;text-align:center;color:var(--muted);font-size:12px;margin:18px;text-decoration:none}
</style></head><body><main class="wrap"><a class="brand" href="index.html">НИЙТ<span>.мн</span></a><section class="panel"><div class="eyebrow">НИЙТ · ТӨЛБӨРИЙН БАРИМТ</div><h1>Баримтаа илгээнэ үү.</h1><p class="sub">Банкны шилжүүлэг хийсэн бол төлбөрийн мэдээлэл, баримтаа оруулна. Админ шалгаж баталгаажуулна. Энэ хэсэг автомат төлбөр хүлээн авахгүй.</p><form id="form"><label for="target">Холбогдох зар эсвэл бизнес *</label><select id="target" required><option value="">Сонгох</option></select><label for="purpose">Төлбөрийн төрөл *</label><select id="purpose" required><option value="listing_fee">Зарын хураамж</option><option value="business_fee">Бизнесийн хураамж</option><option value="featured">Онцлох үйлчилгээ</option><option value="other">Бусад</option></select><label for="amount">Шилжүүлсэн дүн (₮) *</label><input id="amount" type="number" min="1" step="1" required><label for="provider">Банк / төлбөрийн суваг</label><input id="provider" maxlength="80" placeholder="Жишээ: Хаан банк"><label for="reference">Гүйлгээний утга эсвэл дугаар</label><input id="reference" maxlength="120" placeholder="Гүйлгээний утга"><label for="receipt">Баримтын зураг (5 MB хүртэл)</label><input id="receipt" type="file" accept="image/jpeg,image/png,image/webp"><p class="hint">Зөвхөн JPG, PNG, WEBP зураг. Баримтыг админ шалгана.</p><button class="btn" id="send">Баримт илгээх →</button></form><div class="msg" id="msg" role="status" aria-live="polite"></div></section><a class="back" href="account.html">← Миний бүртгэл</a></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://oyxvjatfuqzukdrdlvfb.supabase.co','sb_publishable_s--2ZhRuOvl07HZIr2stqQ_dgDNosK6'),$=id=>document.getElementById(id),msg=t=>{$('msg').textContent=t;$('msg').style.display='block'};
const {data:{session}}=await sb.auth.getSession();if(!session){location.href='auth.html?next=payment.html';}else{
const [l,b]=await Promise.all([sb.from('listings').select('id,title,status').eq('owner_id',session.user.id),sb.from('businesses').select('id,name,status').eq('owner_id',session.user.id)]);
for(const x of l.data||[]){const o=document.createElement('option');o.value='listing:'+x.id;o.textContent='Зар · '+x.title+' ('+x.status+')';$('target').append(o)}
for(const x of b.data||[]){const o=document.createElement('option');o.value='business:'+x.id;o.textContent='Бизнес · '+x.name+' ('+x.status+')';$('target').append(o)}
$('form').onsubmit=async e=>{e.preventDefault();const [kind,id]=$('target').value.split(':');if(!id){msg('Зар эсвэл бизнесээ сонгоно уу.');return}const f=$('receipt').files[0];if(f&&(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5242880)){msg('Баримтын зураг 5 MB-аас бага JPG, PNG, WEBP байх ёстой.');return}
$('send').disabled=true;let receiptUrl=null,path=null;try{if(f){path=session.user.id+'/'+crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error}=await sb.storage.from('niit-private-receipts').upload(path,f,{cacheControl:'3600',upsert:false});if(error)throw error;receiptUrl=path}
const row={user_id:session.user.id,listing_id:kind==='listing'?id:null,business_id:kind==='business'?id:null,amount:Number($('amount').value),currency:'MNT',purpose:$('purpose').value,provider:$('provider').value.trim()||null,reference:$('reference').value.trim()||null,receipt_url:receiptUrl,status:'pending'};
const {error}=await sb.from('payments').insert(row);if(error)throw error;msg('Баримт админы хяналтад илгээгдлээ. Баталгаажсаны дараа хувийн самбарт төлөв шинэчлэгдэнэ.');$('form').reset()}catch(err){if(path)await sb.storage.from('niit-private-receipts').remove([path]);msg(err.message||'Илгээхэд алдаа гарлаа.')}finally{$('send').disabled=false}};
}
</script></body></html>
