<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10110f"><title>Өнөөдрийн хямдрал — НИЙТ.мн</title><style>
:root{color-scheme:dark;--bg:#10110f;--panel:#191a17;--line:#34352e;--gold:#efc34e;--text:#f7f5ed;--muted:#aaa99f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.wrap{max-width:1100px;width:calc(100% - 32px);margin:auto}header{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:950;text-decoration:none;color:var(--text)}.brand span{color:var(--gold)}.back{color:var(--gold);font-size:12px;text-decoration:none;font-weight:850}.hero{padding:36px 0 25px}.eyebrow{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:1.5px}h1{font-size:clamp(30px,5vw,45px);margin:8px 0}.sub{color:var(--muted);font-size:13px}.search{width:100%;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--text);font:inherit}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0 60px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px}.tag{display:inline-block;background:#40331b;color:var(--gold);padding:6px 9px;border-radius:20px;font-size:10px;font-weight:900}.card h2{font-size:17px;margin:12px 0 7px}.desc{font-size:12px;color:#c5c1b6;line-height:1.7}.business{font-size:11px;color:var(--muted);margin-top:14px}.period{font-size:10px;color:var(--muted);margin-top:8px}.link{display:inline-block;margin-top:14px;color:var(--gold);font-size:11px;font-weight:900;text-decoration:none}.empty{border:1px dashed var(--line);border-radius:13px;padding:35px;text-align:center;color:var(--muted);font-size:13px;margin:20px 0 60px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.card{padding:14px}}
</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">НИЙТ<span>.мн</span></a><a class="back" href="index.html">← Нүүр хуудас</a></div></header><main class="wrap"><section class="hero"><div class="eyebrow">ӨНӨӨДРИЙН ОНЦГОЙ САНАЛ</div><h1>Хямдрал, купон, онцгой санал.</h1><p class="sub">НИЙТ-д баталгаажсан бизнесүүдийн хүчинтэй санал.</p><input class="search" id="search" placeholder="Хямдрал, бизнес хайх…" aria-label="Хямдрал хайх"></section><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>Одоогоор хүчинтэй баталгаажсан хямдрал алга.</div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://oyxvjatfuqzukdrdlvfb.supabase.co','sb_publishable_s--2ZhRuOvl07HZIr2stqQ_dgDNosK6');
const grid=document.getElementById('grid'),empty=document.getElementById('empty'),search=document.getElementById('search');
const {data,error}=await sb.from('deals').select('id,title,description,discount_label,starts_at,ends_at,business_id,businesses(name,location)').eq('status','approved').lte('starts_at',new Date().toISOString()).gt('ends_at',new Date().toISOString()).order('ends_at',{ascending:true});
function render(){const q=search.value.trim().toLocaleLowerCase('mn');const rows=(data||[]).filter(x=>(x.title+' '+x.description+' '+x.discount_label+' '+(x.businesses?.name||'')).toLocaleLowerCase('mn').includes(q));grid.replaceChildren();for(const x of rows){const card=document.createElement('article');card.className='card';const tag=document.createElement('span');tag.className='tag';tag.textContent=x.discount_label;const h=document.createElement('h2');h.textContent=x.title;const desc=document.createElement('p');desc.className='desc';desc.textContent=x.description;const business=document.createElement('div');business.className='business';business.textContent=(x.businesses?.name||'Бизнес')+' · '+(x.businesses?.location||'');const period=document.createElement('div');period.className='period';period.textContent='Дуусах: '+new Date(x.ends_at).toLocaleString('mn-MN');const link=document.createElement('a');link.className='link';link.href='business.html?id='+encodeURIComponent(x.business_id);link.textContent='Бизнесийн мэдээлэл →';card.append(tag,h,desc,business,period,link);grid.append(card)}empty.hidden=!!rows.length;if(error)empty.textContent='Хямдралын мэдээлэл татахад алдаа гарлаа.'}
search.addEventListener('input',render);render();
</script></body></html>
