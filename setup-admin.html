<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10110f"><title>Админ эрх идэвхжүүлэх — НИЙТ.мн</title><style>
:root{color-scheme:dark;--bg:#10110f;--panel:#191a17;--line:#34352e;--gold:#efc34e;--text:#f7f5ed;--muted:#aaa99f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:18px}.panel{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:25px}.brand{text-align:center;font-size:25px;font-weight:950;margin-bottom:25px}.brand span{color:var(--gold)}.eyebrow{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:1.4px}h1{font-size:24px;margin:8px 0}.muted{font-size:12px;color:var(--muted);line-height:1.7}label{display:block;font-size:12px;font-weight:800;margin:18px 0 7px}input{width:100%;padding:14px;background:#10110f;color:var(--text);border:1px solid var(--line);border-radius:10px;font:inherit}.btn{width:100%;padding:14px;margin-top:16px;border:0;border-radius:10px;background:var(--gold);color:#17150e;font-weight:950}.msg{display:none;margin-top:14px;padding:12px;border-radius:9px;background:#25251e;color:#f0d98f;font-size:12px;line-height:1.6}.back{display:block;text-align:center;color:var(--muted);font-size:12px;margin-top:18px;text-decoration:none}
</style></head><body><main class="panel"><div class="brand">НИЙТ<span>.мн</span></div><div class="eyebrow">НЭГ УДААГИЙН ТОХИРУУЛГА</div><h1>Анхны админ эрх</h1><p class="muted">Энэ үйлдэл зөвхөн НИЙТ.мн-ийн анхны админыг тохируулна. Өмнө нь админ үүссэн эсвэл нэг удаагийн түлхүүр ашиглагдсан бол дахин ажиллахгүй.</p><form id="form"><label for="token">Нэг удаагийн админ түлхүүр</label><input id="token" type="password" required autocomplete="off" minlength="20"><button class="btn" id="submit">Админ эрх идэвхжүүлэх</button></form><div class="msg" id="msg" role="status" aria-live="polite"></div><a class="back" href="account.html">← Миний бүртгэл</a></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://oyxvjatfuqzukdrdlvfb.supabase.co','sb_publishable_s--2ZhRuOvl07HZIr2stqQ_dgDNosK6');
const {data:{session}}=await sb.auth.getSession();if(!session)location.href='auth.html?next=setup-admin.html';
const $=id=>document.getElementById(id);
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;const {error}=await sb.rpc('bootstrap_first_admin',{p_token:$('token').value.trim()});$('msg').style.display='block';if(error){$('msg').textContent=error.message;$('submit').disabled=false}else{$('msg').textContent='Админ эрх амжилттай идэвхжлээ. Админ самбар руу шилжүүлж байна.';setTimeout(()=>location.href='admin.html',1200)}};
</script></body></html>
