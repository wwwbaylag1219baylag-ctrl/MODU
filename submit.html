<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10110f"><title>Зар нийтлэх — НИЙТ.мн</title><style>
:root{color-scheme:dark;--bg:#10110f;--panel:#191a17;--line:#34352e;--gold:#efc34e;--text:#f7f5ed;--muted:#aaa99f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:22px}.wrap{max-width:760px;margin:auto}.brand{display:block;text-align:center;font-size:27px;font-weight:950;text-decoration:none;color:var(--text);margin:10px 0 24px}.brand span{color:var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px}.eyebrow{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:1.5px}h1{font-size:27px;margin:8px 0}.sub{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:800;margin:14px 0 7px}input,select,textarea{width:100%;border:1px solid var(--line);background:#10110f;border-radius:10px;padding:13px;color:var(--text);font:inherit;font-size:13px}textarea{min-height:130px;resize:vertical}input:focus,select:focus,textarea:focus{outline:1px solid var(--gold);border-color:var(--gold)}.check{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px;margin-top:16px}.check input{width:auto}.notice{padding:12px;border:1px solid #665329;background:#242016;border-radius:10px;color:#efdda9;font-size:12px;line-height:1.7;margin:16px 0}.hint{font-size:10px;color:var(--muted);line-height:1.6;margin-top:6px}.primary{width:100%;padding:14px;background:var(--gold);color:#17150e;border:0;border-radius:10px;font-weight:950;margin-top:20px;cursor:pointer}.primary:disabled{opacity:.55}.msg{display:none;margin-top:14px;padding:12px;border-radius:9px;background:#27251d;color:#f2d98c;font-size:12px;line-height:1.6}.back{display:block;text-align:center;color:var(--muted);font-size:12px;margin:18px;text-decoration:none}@media(max-width:560px){body{padding:12px}.panel{padding:18px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><main class="wrap"><a class="brand" href="index.html">НИЙТ<span>.мн</span></a><section class="panel"><div class="eyebrow">НИЙТ · ЗАР НИЙТЛЭХ</div><h1>Зараа байршуулъя.</h1><p class="sub">Мэдээллээ бөглөж илгээнэ үү. Зар эхлээд хяналтад орж, админ баталгаажуулсны дараа нийтэд харагдана.</p><div class="notice" id="feeNotice">Зарын суурь хураамжийг ачаалж байна…</div><form id="form"><div class="grid">
<div class="full"><label for="title">Зарын гарчиг *</label><input id="title" required minlength="5" maxlength="140" placeholder="Жишээ: 2 өрөө байр түрээслүүлнэ"></div>
<div><label for="category">Ангилал *</label><select id="category" required><option value="">Ангилал сонгох</option><option value="shopping">Худалдаа</option><option value="property">Үл хөдлөх</option><option value="auto">Авто</option><option value="services">Үйлчилгээ</option><option value="food">Хоол, хүнс</option><option value="jobs">Ажил, бизнес</option><option value="education">Боловсрол</option><option value="health">Эрүүл мэнд</option><option value="travel">Аялал</option><option value="events">Үзвэр, эвент</option><option value="pets">Амьтан</option><option value="other">Бусад</option></select></div>
<div><label for="subcategory">Дэд ангилал</label><input id="subcategory" maxlength="100" placeholder="Дэд ангилал"></div>
<div class="full"><label for="description">Дэлгэрэнгүй тайлбар *</label><textarea id="description" required minlength="10" maxlength="10000" placeholder="Бараа, үйлчилгээний нөхцөл, онцлогийг дэлгэрэнгүй бичнэ үү."></textarea></div>
<div><label for="price">Үнэ (₮)</label><input id="price" type="number" min="0" step="1" placeholder="Жишээ: 150000"></div>
<div><label for="location">Байршил *</label><select id="location" required><option value="">Байршил сонгох</option><option>Улаанбаатар</option><option>Дархан</option><option>Эрдэнэт</option><option>Өөр аймаг, сум</option></select></div>
<div class="full"><label for="phone">Холбоо барих утас</label><input id="phone" type="tel" maxlength="30" placeholder="Утасны дугаар"></div>
<div class="full"><label for="images">Зураг (5 хүртэл, тус бүр 5 MB-аас бага)</label><input id="images" type="file" accept="image/jpeg,image/png,image/webp" multiple><p class="hint">JPG, PNG, WEBP. Хувийн зураг таны бүртгэлийн хавтсанд хадгалагдана.</p></div>
</div><label class="check"><input id="negotiable" type="checkbox"> Үнэ тохиролцоно</label><label class="check"><input id="agree" type="checkbox" required> Мэдээлэл үнэн зөв бөгөөд нийтлэх эрхтэй гэдгээ баталж байна.</label><button class="primary" id="send" type="submit">Хяналтад илгээх →</button></form><div class="msg" id="msg" role="status" aria-live="polite"></div></section><a class="back" href="index.html">← Нүүр хуудас</a></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://oyxvjatfuqzukdrdlvfb.supabase.co','sb_publishable_s--2ZhRuOvl07HZIr2stqQ_dgDNosK6');
const $=id=>document.getElementById(id),msg=t=>{$('msg').textContent=t;$('msg').style.display='block'};
const {data:{session}}=await sb.auth.getSession();if(!session)location.href='auth.html?next=submit.html';
const {data:feeSetting}=await sb.from('app_settings').select('value').eq('key','listing_base_fee').maybeSingle();const fee=Number(feeSetting?.value)||0;$('feeNotice').textContent=fee>0?'Зарын суурь хураамж: '+new Intl.NumberFormat('mn-MN').format(fee)+' ₮. Төлбөрийн баримтаа илгээж админ баталгаажуулсны дараа зар нийтлэгдэнэ.':'Одоогоор зарын суурь хураамж 0 ₮.';
const editId=new URLSearchParams(location.search).get('id');let existingImages=[];
if(session&&editId){const {data:x,error}=await sb.from('listings').select('*').eq('id',editId).eq('owner_id',session.user.id).maybeSingle();if(error||!x){msg('Зар олдсонгүй эсвэл засах эрхгүй байна.')}else{$('title').value=x.title;$('category').value=x.category;$('subcategory').value=x.subcategory||'';$('description').value=x.description;$('price').value=x.price??'';$('location').value=x.location;$('phone').value=x.contact_phone||'';$('negotiable').checked=x.price_negotiable;existingImages=x.images||[];document.querySelector('h1').textContent='Зараа засах.';$('send').textContent='Шинэчлээд хяналтад илгээх →';msg('Одоогийн зураг: '+existingImages.length+'. Шинэ зураг нэмэх боломжтой.')}}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(!session)return;const files=[...$('images').files];if(files.length+existingImages.length>5){msg('Нийт 5 хүртэл зураг байж болно.');return}if(files.some(f=>!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5242880)){msg('Зөвхөн JPG, PNG, WEBP зураг (5 MB-аас бага) оруулна уу.');return}
$('send').disabled=true;$('send').textContent='Илгээж байна…';const paths=[];
try{for(const f of files){const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=session.user.id+'/'+crypto.randomUUID()+'-'+safe;const {error}=await sb.storage.from('niit-uploads').upload(path,f,{cacheControl:'3600',upsert:false});if(error)throw error;paths.push(sb.storage.from('niit-uploads').getPublicUrl(path).data.publicUrl)}
const price=$('price').value.trim();const row={owner_id:session.user.id,title:$('title').value.trim(),description:$('description').value.trim(),category:$('category').value,subcategory:$('subcategory').value.trim()||null,price:price?Number(price):null,price_negotiable:$('negotiable').checked,currency:'MNT',location:$('location').value,contact_phone:$('phone').value.trim()||null,images:[...existingImages,...paths],status:'pending'};
let error;if(editId){({error}=await sb.from('listings').update(row).eq('id',editId).eq('owner_id',session.user.id))}else{({error}=await sb.from('listings').insert(row))}
if(error)throw error;msg(editId?'Зарын өөрчлөлт хяналтад илгээгдлээ.':'Зар амжилттай илгээгдлээ. Админ хянаж баталгаажуулсны дараа нийтэд харагдана.');$('form').reset();setTimeout(()=>location.href='account.html',1600);
}catch(err){if(paths.length)await sb.storage.from('niit-uploads').remove(paths.map(u=>u.split('/niit-uploads/')[1]));msg(err.message||'Илгээхэд алдаа гарлаа. Дахин оролдоно уу.')}finally{$('send').disabled=false;$('send').textContent=editId?'Шинэчлээд хяналтад илгээх →':'Хяналтад илгээх →'}});
</script></body></html>
